name: Quality

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        dependencies: [lowest, highest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: fileinfo, ctype, mbstring, dom
          tools: composer:2.9.8@sha256:59b2c50e10cafa0d8efc19ede9a326d782f096c674a26baf98cf042ce23de890
      - run: composer validate --strict
      - name: Require the CGI executable for actual HTTP-header tests
        run: |
          binary="$(command -v php-cgi || true)"
          if [ -z "$binary" ]; then
            binary="$(dirname "$(command -v php)")/php-cgi"
          fi
          if [ ! -x "$binary" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y "php${{ matrix.php }}-cgi"
            binary="$(command -v php-cgi${{ matrix.php }} || command -v php-cgi)"
          fi
          test -x "$binary"
          "$binary" -v
          "$binary" -v | grep -F "PHP ${{ matrix.php }}."
          echo "PHP_CGI_BINARY=$binary" >> "$GITHUB_ENV"
      - if: matrix.dependencies == 'highest'
        run: composer update --no-interaction --prefer-dist --no-progress
      - if: matrix.dependencies == 'lowest'
        run: composer update --no-interaction --prefer-dist --prefer-lowest --prefer-stable --no-progress
      - run: composer audit
      - run: composer check
      - if: matrix.php == '8.5' && matrix.dependencies == 'highest'
        run: composer benchmark
